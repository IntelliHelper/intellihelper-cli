[package]
license = "Apache-2.0"
name = "intellihelper-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the intellihelper CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
intellihelper-auth = { workspace = true, features = ["middleware"] }
intellihelper-extra-ca = { workspace = true }
intellihelper-sampler = { path = "../intellihelper-sampler" }
intellihelper-telemetry = { workspace = true }
intellihelper-version = { workspace = true }
intellihelper-workspace = { workspace = true }

[lints]
workspace = true
