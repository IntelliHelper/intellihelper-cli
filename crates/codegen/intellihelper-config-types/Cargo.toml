[package]
license = "Apache-2.0"
name = "intellihelper-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the intellihelper CLI, extracted from intellihelper-shell for dependency inversion."

[dependencies]
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
intellihelper-announcements = { workspace = true }
intellihelper-config = { workspace = true }
intellihelper-mcp = { workspace = true }

[features]
default-bazel = []

[lints]
workspace = true
